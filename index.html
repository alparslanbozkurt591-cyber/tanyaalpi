<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16624C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TanyaAlpi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TanyaAlpi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a one-column phone ledger. Month summary first, detail below, thumb-reach tab bar at the bottom. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#13201B; --muted:#4F5E58; --line:#D6DFDA;
  --accent:#16624C; --accent-ink:#FFFFFF; --accent-soft:#DCEEE6;
  --warn:#9A5B00; --warn-soft:#FBEACB; --bad:#B3261E; --bad-soft:#F9DEDC;
  --scrim:rgba(10,20,16,.42);
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --r-sm:10px; --r-lg:20px;
  --accent-2:#B07A12; --accent-2-soft:#FBF0D6;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#151D1A; --surface-2:#1B2521; --ink:#E3ECE8; --muted:#A2B1AA; --line:#28342F;
  --accent:#5CC9A0; --accent-ink:#05261A; --accent-soft:#17382D;
  --warn:#E9A644; --warn-soft:#3A2A10; --bad:#F2867E; --bad-soft:#3D1A18; --scrim:rgba(0,0,0,.6); --accent-2:#F0C14B; --accent-2-soft:#3A2F12;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151D1A; --surface-2:#1B2521; --ink:#E3ECE8; --muted:#A2B1AA; --line:#28342F;
  --accent:#5CC9A0; --accent-ink:#05261A; --accent-soft:#17382D;
  --warn:#E9A644; --warn-soft:#3A2A10; --bad:#F2867E; --bad-soft:#3D1A18; --scrim:rgba(0,0,0,.6); --accent-2:#F0C14B; --accent-2-soft:#3A2F12;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font-variant-numeric:tabular-nums}
p,.note,.tip p{text-wrap:pretty}
.card-h h2{min-width:0}
/* line icons for the app's own controls; emoji are kept for categories only */
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.x .ic{width:16px;height:16px} .x.sm .ic{width:13px;height:13px}
/* feedback */
.btn,.tab,.chip,.iconbtn,.x,.mchip,.lrow,.tx,.scorechip{transition:transform .12s ease, background-color .15s ease}
.btn:active,.chip:active,.iconbtn:active,.x:active,.mchip:active,.scorechip:active{transform:scale(.96)}
.tab:active .plus,.tab:active svg{transform:scale(.92)}
.meter i,.fmeter i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.toast.show{animation:toastIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.tx.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,35%{background:var(--accent-soft)}100%{background:transparent}}
.gauge .arc{animation:draw .9s cubic-bezier(.2,.8,.2,1)}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
/* loading */
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:8px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .toast.show,.tx.flash,.gauge .arc,.skel,.spin{animation:none}
  .meter i,.fmeter i,.btn,.tab,.chip,.iconbtn,.x,.mchip,.lrow,.tx,.scorechip{transition:none}
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 24px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:17px;font-weight:700}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:18px}
.mark{display:inline-flex;gap:3px;align-items:center}
.mark svg,.foot svg{width:22px;height:15px;border-radius:3px;box-shadow:0 0 0 1px var(--line);display:block;flex:none}
.foot{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;padding-top:4px}
.foot svg{width:18px;height:12px}
.score{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.gauge{width:120px;height:120px}
.gauge text{fill:var(--ink);font-family:var(--f-display)} .gauge .lbl{fill:var(--muted);font-family:var(--f-body)}
.grade{font-family:var(--f-display);font-size:24px;font-weight:700;display:block;margin-bottom:4px}
.factors{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.frow span{font-weight:600;font-size:14px}
.frow b{font-size:14px}
.frow .meter{grid-column:1 / -1;height:6px}
.frow small{grid-column:1 / -1;color:var(--muted);font-size:13px}
.gain{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 7px;line-height:1.3;white-space:nowrap}
.scorechip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;align-self:flex-start;min-height:40px}
.scorechip b{font-family:var(--f-display);font-size:18px}
.scorechip:hover{background:var(--surface-2)}
@media (max-width:360px){.score{grid-template-columns:1fr;justify-items:center;text-align:center}}
.stat2,.stat3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat3{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.stat2>div,.stat3>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat2 b,.stat3 b{font-family:var(--f-display);font-size:22px;font-weight:700}
.stat2 small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small.up,.tag.up{color:var(--bad)} small.down{color:var(--accent)}
.tag.up{background:var(--bad-soft);border-color:transparent}
.tag.down,.tag.new{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.soon{color:var(--warn)!important;font-weight:600}
.fmeter{position:relative;height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.fmeter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.fmeter.over i{background:var(--warn)}
.fmeter em{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.tx.alert .ico{box-shadow:inset 0 0 0 2px var(--warn)}
.tips{display:flex;flex-direction:column;gap:10px}
.tip{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tip .e{font-size:18px;line-height:1.3}
.tip p{margin:0;font-size:14px}
.x.sm{width:28px;height:28px;border-radius:7px}
.goal{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.goal .meter i{background:var(--accent-2)}
.goal-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.goal-h b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-a{display:grid;grid-template-columns:1fr auto 40px;gap:6px;margin-top:2px}
.goal-a .input{min-height:40px;padding:8px 10px}
.goal-a .btn{min-height:40px;padding:8px 14px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk div{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wcell{width:100%;aspect-ratio:1;max-width:44px;border-radius:8px;border:1px solid var(--line)}
.wk b{font-size:11px;font-weight:600}
.wk small{font-size:11px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal em{font-style:normal;font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cd{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums;border:1px solid var(--line);color:var(--ink)}
.cd.fut{border-style:dashed;color:var(--muted);background:transparent}
.cd.today{outline:2px solid var(--accent-2);outline-offset:1px}
.toggle{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding-top:10px;border-top:1px solid var(--line);cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px}
.toggle span{display:flex;flex-direction:column;gap:2px}
.toggle small{color:var(--muted);font-size:13px}
.mchips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mchip{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px 0;font-size:13px;font-weight:600;text-decoration:line-through;min-height:38px}
.mchip.on{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);text-decoration:none}
.seg.period{display:grid;grid-template-columns:1fr 1fr}
.seg.period button{text-align:center}
.topr{display:flex;align-items:center;gap:6px}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear{color:var(--muted)} .gear.on{color:var(--accent);background:var(--accent-soft)}
.sync{white-space:nowrap;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--accent)} .sync.warn::before{background:var(--warn)}

.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.monthbar span{font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;font-size:20px;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:disabled{opacity:.3;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}

.hero{padding:6px 2px 2px;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,14vw,64px);line-height:1;letter-spacing:-.02em}
.big .p{font-size:.5em;letter-spacing:0}
.delta{font-size:14px;color:var(--muted)}
.delta b{font-weight:600}
.delta .up{color:var(--bad)} .delta .down{color:var(--accent)}

.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.warn i{background:var(--warn)} .meter.over i{background:var(--bad)}
.meter-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.meter-l .over{color:var(--bad);font-weight:600} .meter-l .warn{color:var(--warn);font-weight:600}

.split{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
@media (max-width:380px){.split{grid-template-columns:1fr}.donut{margin:0 auto}}
.donut{width:132px;height:132px}
.donut text{fill:var(--ink);font-family:var(--f-display)}
.donut .lbl{fill:var(--muted);font-family:var(--f-body)}
.legend{display:flex;flex-direction:column;gap:2px;min-width:0}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:7px 4px;border-radius:10px;width:100%}
.lrow:hover{background:var(--surface-2)}
.lrow .nm{min-width:0;display:flex;flex-direction:column;gap:5px}
.lrow .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .v{text-align:right;font-weight:600}
.lrow .v small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.lrow .meter{height:5px}

.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none;
  background:color-mix(in srgb, var(--c) 20%, var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent)}

.bars{width:100%;height:auto;display:block}
.bars text{font-size:10px;fill:var(--muted);font-family:var(--f-body)}
.bars .cur{fill:var(--ink);font-weight:600}

.txlist{display:flex;flex-direction:column}
.day{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 4px 6px}
.day:first-child{padding-top:2px}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 4px;border-radius:10px}
.tx:hover{background:var(--surface-2)}
.tx .t{min-width:0;display:flex;flex-direction:column}
.tx .t b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);vertical-align:1px}
.tag.ex{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;font-size:16px}
textarea.input{min-height:90px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.search{position:relative}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.row2{grid-template-columns:1fr}}

.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;max-width:34ch;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.banner .link{color:inherit;text-decoration:underline}
.note{font-size:13px;color:var(--muted);margin:0}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.add .plus{width:50px;height:50px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px}
.tab.add .plus svg{width:26px;height:26px;stroke-width:2.4}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount:focus-within{border-color:var(--accent)}
.amount span{font-family:var(--f-display);font-size:34px;color:var(--muted)}
.amount input{border:0;background:none;outline:none;font-family:var(--f-display);font-weight:700;font-size:40px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;line-height:1.2;text-align:center;min-height:56px}
.chip .e{font-size:18px}
.chip.on{border-color:var(--c);background:color-mix(in srgb, var(--c) 18%, var(--surface));box-shadow:inset 0 0 0 1px var(--c)}
.sugg{font-style:normal;font-weight:500;color:var(--accent);font-size:12px}
.err{color:var(--bad);font-size:14px;margin:0}
.sheet .actions{display:flex;gap:8px}
.sheet .actions .btn{flex:1} .sheet .actions #f-save{flex:2}

/* Import */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:calc(var(--r-sm) - 3px);font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stats span{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.stats .good{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.irow.off{opacity:.62}
.irow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.irow .t{min-width:0}
.irow .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .t small{color:var(--muted);font-size:12px}
.irow .a{font-weight:600}
.irow select{grid-column:2 / 4;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:14px;min-height:36px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.howto{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}

/* Settings */
.crow{display:grid;grid-template-columns:52px 1fr 104px 40px;gap:8px;align-items:center}
.crow .input{min-height:40px;padding:8px 10px}
.crow .emo{text-align:center;font-size:18px;padding:6px}
.crow .bud{position:relative}
.crow .bud::before{content:"£";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.crow .bud .input{padding-left:22px}
.chead{display:grid;grid-template-columns:52px 1fr 104px 40px;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.rrow{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center;font-size:14px}
.rrow code{font-family:inherit;font-size:13px;background:var(--surface-2);border:1px solid var(--line);padding:4px 8px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow select{min-height:38px;padding:6px 8px;font-size:14px}
.x{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.x:hover{color:var(--bad)}
.x[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="wrap">

<div id="sheet" class="sheet-wrap" hidden>
  <div class="scrim" data-act="close"></div>
  <form class="sheet" id="txform" autocomplete="off">

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const view = $('#view');
const IC = { x:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GBP = new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
const GBP0 = new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0});
const fmt = p => GBP.format(p/100);
const fmt0 = p => GBP0.format(Math.round(p/100));
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const t=new Date(); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; };
const ymOf = d => d.slice(0,7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const shiftYM = (ym,n) => { let [y,m]=ym.split('-').map(Number); m+=n; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return `${y}-${pad(m)}`; };
const ymLabel = (ym,opt={month:'long',year:'numeric'}) => { const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-GB',opt); };
const daysIn = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); };

/* ---------- Categories and auto-categorising ---------- */
const DEFAULT_CATS = [
  ['groceries','Groceries','🛒','#3E9B5A'], ['eating','Eating out','🍽️','#E27B36'], ['transport','Transport','🚆','#3D5FD1'],
  ['bills','Bills & utilities','💡','#8D67CF'], ['housing','Rent & housing','🏠','#A0522D'], ['shopping','Shopping','🛍️','#D8A622'],
  ['subs','Subscriptions','🔁','#5AA9E6'], ['fun','Entertainment','🎟️','#E3608F'], ['health','Health & fitness','💊','#2BA88F'],
  ['personal','Personal care','💇','#B57EDC'], ['travel','Travel','✈️','#4C6A92'], ['gifts','Gifts & charity','🎁','#E04F5F'],
  ['other','Other','📦','#8A938F']
].map(([id,name,icon,color]) => ({id,name,icon,color,budget:0}));
const EXTRA_COLORS = ['#C0763B','#3F8F9E','#9C5BB5','#6B8E23','#D2691E','#4682B4','#C71585','#708090'];
const KW = {
  groceries:['tesco','sainsburys','sainsbury','asda','morrisons','aldi','lidl','waitrose','coop','co op','iceland','ocado','m and s food','marks and spencer','simply food','spar','budgens','farmfoods','whole foods','planet organic',
    'tazaki','tazaki foods','japan centre','wing yip','see woo','loon fung','h mart','oseyo','korea foods','tfc','turkish food centre','turkish food market','yasar halim','gima','best food','costcutter','nisa','londis','premier','one stop','booths','centra','polski sklep','smaki','bestway','booker','costco','makro','gousto','hello fresh','hellofresh','getir','zapp','supermarket','supermarkets','grocer','grocers','grocery','food market','food centre','food center','minimarket','mini market','butcher','butchers','bakery','greengrocer','deli'],
  eating:['mcdonalds','kfc','nandos','greggs','pret','pret a manger','costa','starbucks','caffe nero','deliveroo','just eat','uber eats','wagamama','dominos','pizza','pizza express','subway','leon','itsu','five guys','burger king','wasabi','tortilla','pub','wetherspoon','gail','cafe','restaurant','tim hortons','popeyes','honest burgers','dishoom'],
  transport:['tfl','transport for london','uber','bolt','trainline','national rail','lner','gwr','avanti','southern','thameslink','southeastern','northern','scotrail','crosscountry','shell','esso','texaco','bp','parking','ringgo','paybyphone','justpark','stagecoach','arriva','first bus','citymapper','lime','zipcar','dvla','halfords'],
  bills:['british gas','octopus energy','octopus','edf','eon','e on','ovo','scottish power','thames water','severn trent','united utilities','anglian water','council tax','bt','virgin media','sky','ee','vodafone','o2','three','giffgaff','tv licence','tv licensing','insurance','aviva','direct line','admiral','hyperoptic','plusnet','talktalk'],
  housing:['rent','mortgage','openrent','letting','lettings','foxtons','service charge','ground rent'],
  shopping:['amazon','amzn','ebay','argos','john lewis','primark','zara','h&m','asos','next','ikea','currys','tk maxx','uniqlo','marks spencer','m&s','apple store','etsy','vinted','shein','b&q','wilko','the range','dunelm','superdry','jd sports','sports direct','waterstones','wh smith','whsmith','poundland','b&m','home bargains','screwfix','toolstation'],
  subs:['netflix','spotify','disney','disney plus','prime video','amazon prime','apple bill','icloud','youtube','youtube premium','now tv','audible','chatgpt','openai','claude','anthropic','patreon','xbox game pass','playstation plus','google storage','google one','microsoft 365','dropbox','adobe','duolingo','deezer','tidal','paramount'],
  fun:['cinema','odeon','vue','cineworld','picturehouse','everyman','ticketmaster','see tickets','eventbrite','dice','steam','playstation','nintendo','xbox','bowling','theatre','skiddle','tesco entertainment'],
  health:['boots','superdrug','pharmacy','chemist','puregym','pure gym','the gym','gym group','david lloyd','nuffield','dentist','dental','nhs','specsavers','vision express','optician','bupa','physio'],
  personal:['barber','barbers','salon','hair','nails','lush','beauty','spa','treatwell'],
  travel:['easyjet','ryanair','british airways','airbnb','booking','hotel','premier inn','travelodge','expedia','jet2','tui','wizz','eurostar','hostel','lastminute','skyscanner'],
  gifts:['charity','oxfam','gofundme','moonpig','funky pigeon','interflora','justgiving','british heart foundation','cancer research','red cross','donation']
};
const NOISE = new Set(['card','payment','pos','visa','debit','contactless','purchase','ref','gbp','gb','uk','london','ltd','limited','plc','www','com','online','the','at','clp','mastercard','apple','pay','via','to','from','fp','dd','so','bgc','tfr']);
// Towns and place words that banks print under the seller's name. They never decide a category.
['manchester','birmingham','leeds','glasgow','liverpool','bristol','edinburgh','cardiff','sheffield','newcastle','nottingham','leicester','coventry','belfast','brighton','southampton','portsmouth','croydon','wembley','stratford','camden','hackney','islington','westminster','kensington','chelsea','harrow','ealing','barnet','enfield','ilford','romford','watford','luton','slough','wimbledon','greenwich','lewisham','brixton','hammersmith','fulham','shoreditch','holborn','soho','paddington','gbr','united','kingdom','england','scotland','wales','ireland'].forEach(w=>NOISE.add(w));
const NOISE_LINE = new Set(['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec','january','february','march','april','june','july','august','september','october','november','december','on','ending','no','number','date','rate','fee','reference','gbp']);
const isNoise = s => toks(s).filter(w => w.length>1 && !NOISE_LINE.has(w)).length===0;
const norm = s => String(s||'').toLowerCase().replace(/['’`]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim();
const toks = s => norm(s).split(' ').filter(w => w && !NOISE.has(w) && !/\d{3,}/.test(w) && !/^\d+$/.test(w));
const hay = s => ' ' + toks(s).join(' ') + ' ';
const merchantKey = s => toks(s).filter(w => w.length>1 || /[a-z]/.test(w)).slice(0,3).join(' ');
const KW_N = Object.fromEntries(Object.entries(KW).map(([c,list]) => [c, [...new Set(list.map(k => toks(k).join(' ')).filter(Boolean))]]));

function suggest(desc){
  const h = hay(desc);
  if (h.trim()==='') return {c:'other',src:null};
  const cats = new Set(S.settings.cats.map(c=>c.id));
  let best=null, len=0;
  for (const [k,c] of Object.entries(S.settings.rules)) {
    if (k && cats.has(c) && h.includes(' '+k+' ') && k.length>len) { best=c; len=k.length; }
  }
  if (best) return {c:best,src:'learned'};
  for (const [c,list] of Object.entries(KW_N)) {
    if (!cats.has(c)) continue;
    for (const k of list) if (h.includes(' '+k+' ') && k.length>len) { best=c; len=k.length; }
  }
  return best ? {c:best,src:'match'} : {c:'other',src:null};
}

/* ---------- State ---------- */
const defaults = () => ({ cats: DEFAULT_CATS.map(c=>({...c})), rules:{}, maps:{}, v:1 });
function cleanSettings(d){
  const s = defaults();
  if (d && Array.isArray(d.cats) && d.cats.length) s.cats = JSON.parse(JSON.stringify(d.cats));
  if (!s.cats.some(c=>c.id==='other')) s.cats.push({...DEFAULT_CATS.at(-1)});
  if (d && d.rules && typeof d.rules==='object') s.rules = {...d.rules};
  if (d && d.maps && typeof d.maps==='object') s.maps = JSON.parse(JSON.stringify(d.maps));
  s.rv = (d && d.rv) || 0;
  s.excl = (d && Array.isArray(d.excl)) ? d.excl.filter(m=>/^\d{4}-\d{2}$/.test(m)) : [];
  s.goals = (d && Array.isArray(d.goals)) ? JSON.parse(JSON.stringify(d.goals)) : [];
  s.notRec = (d && Array.isArray(d.notRec)) ? [...d.notRec] : [];
  s.okUnusual = (d && Array.isArray(d.okUnusual)) ? d.okUnusual.slice(-300) : [];
  s.roll = (d && d.roll && typeof d.roll==='object') ? {...d.roll} : {on:false};
  s.seenReview = (d && d.seenReview) || '';
  return s;
}
// Re-run auto-categorising on payments sitting in Other (never on ones you picked yourself)
function resortOther(){
  let n=0;
  for (const m of Object.keys(S.months)) {
    let changed=false;
    S.months[m] = S.months[m].map(t => {
      if (t.c!=='other' || t.man) return t;
      const s=suggest(t.t); if (s.c==='other') return t;
      n++; changed=true; return {...t, c:s.c};
    });
    if (changed) Store.saveMonth(m);
  }
  return n;
}
const RV = 2;
function reviseOnce(){
  if ((S.settings.rv||0) >= RV) return;
  setTimeout(() => {
    if ((S.settings.rv||0) >= RV) return;
    const n = resortOther(); S.settings.rv = RV; Store.saveSettings();
    if (n) { toast(`Re-sorted ${n} payment${n===1?'':'s'} out of Other`); render(); }
  }, 0);
}
let savedTab = 'overview';
try { savedTab = localStorage.getItem('pl.tab') || 'overview'; } catch(e) {}
const S = { settings: defaults(), months:{}, month: ymOf(todayISO()), tab: ['overview','tx','import','insights','settings'].includes(savedTab)?savedTab:'overview',
  mode:'loading', ready:false, q:'', catFilter:'', imp:null, period:'month', year: todayISO().slice(0,4) };
const catById = id => S.settings.cats.find(c=>c.id===id) || S.settings.cats.find(c=>c.id==='other') || DEFAULT_CATS.at(-1);
const monthTx = ym => (S.months[ym]||[]);
const allTx = () => Object.entries(S.months).flatMap(([m,arr]) => arr.map(t => ({...t, m})));

/* ---------- Storage: your private cloud space when available, this device otherwise ---------- */
const queues = {};
function enqueue(key, fn){
  queues[key] = (queues[key]||Promise.resolve()).then(fn).catch(e => { console.error(e);
    toast(e && e.code==='quota_exceeded' ? 'Storage is full. Delete some old months to keep saving.' : 'Couldn’t save that change. Check your connection and try again.'); });
  return queues[key];
}
const Store = {
  db:null, base:null,
  async init(){
    let db=null, user=null, id=null;
    try {
      if (window.claude && typeof window.claude.use==='function') {
        [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        id = user ? await user.id() : null;
      }
    } catch(e) { console.warn(e); }
    if (db && id) return this.initCloud(db, id);
    this.initLocal();
  },
  initLocal(){
    S.mode='local';
    try {
      const raw = localStorage.getItem('pl.data');
      if (raw) { const d=JSON.parse(raw); S.settings=cleanSettings(d.settings); S.months=d.months||{}; }
    } catch(e) {}
    S.ready=true; render(true); reviseOnce();
  },
  initCloud(db, id){
    this.db=db; this.base='data/users/'+id+'/profile';
    S.mode='cloud';
    const sref = db.doc(this.base), mcol = sref.collection('months');
    let sOk=false, mOk=false, sAny=false, mAny=false;
    const check = () => { if (sOk && mOk && !S.ready) { S.ready=true; clearTimeout(timer); render(); reviseOnce(); } };
    const timer = setTimeout(() => { if(!S.ready){ S.mode='slow'; renderChrome(); } }, 10000);
    sref.onSnapshot(snap => {
      S.settings = snap.exists ? cleanSettings(snap.data()) : (sAny ? S.settings : defaults());
      sAny=true; if (!snap.metadata.fromCache) sOk=true; check(); render();
    }, e => { console.error(e); S.mode='error'; renderChrome(); });
    mcol.onSnapshot(qs => {
      const m={};
      qs.docs.forEach(d => { const t=d.data()?.tx; if (Array.isArray(t) && t.length) m[d.id]=t.map(x=>({...x})); });
      S.months=m; mAny=true; if (!qs.metadata.fromCache) mOk=true;
      if (S.mode==='slow') S.mode='cloud';
      check(); render();
    }, e => { console.error(e); S.mode='error'; renderChrome(); });
  },
  saveLocal(){ try { localStorage.setItem('pl.data', JSON.stringify({settings:S.settings, months:S.months})); } catch(e) { toast('This browser won’t let the page save. Try a normal (not private) window.'); } },
  saveSettings(){
    if (S.mode==='local') return this.saveLocal();
    return enqueue('settings', () => this.db.doc(this.base).set(JSON.parse(JSON.stringify(S.settings))));
  },
  saveMonth(ym){
    if (S.mode==='local') return this.saveLocal();
    return enqueue('m:'+ym, () => {
      const ref = this.db.doc(this.base).collection('months').doc(ym);
      const arr = S.months[ym]||[];
      return arr.length ? ref.set({tx: arr.map(t=>({...t}))}) : ref.delete();
    });
  }
};
let settingsTimer=null;
const saveSettingsSoon = () => { clearTimeout(settingsTimer); settingsTimer=setTimeout(()=>Store.saveSettings(), 500); };

function putTx(tx, oldMonth){
  const m = ymOf(tx.d);
  if (oldMonth && S.months[oldMonth]) {
    S.months[oldMonth] = S.months[oldMonth].filter(t=>t.id!==tx.id);
    if (!S.months[oldMonth].length) delete S.months[oldMonth];
    if (oldMonth!==m) Store.saveMonth(oldMonth);
  }
  S.months[m] = [...(S.months[m]||[]).filter(t=>t.id!==tx.id), tx];
  Store.saveMonth(m);
}
function removeTx(id, m){
  if (!S.months[m]) return;
  S.months[m] = S.months[m].filter(t=>t.id!==id);
  if (!S.months[m].length) delete S.months[m];
  Store.saveMonth(m);
}

/* ---------- UI helpers ---------- */
let toastT=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2800); }
function armed(btn){
  if (btn.dataset.armed) { delete btn.dataset.armed; return true; }
  btn.dataset.armed='1'; const old=btn.innerHTML; btn.textContent = btn.classList.contains('x') ? '✓' : 'Tap again to confirm';
  setTimeout(()=>{ if (btn.isConnected && btn.dataset.armed){ delete btn.dataset.armed; btn.innerHTML=old; } }, 3500);
  return false;
}
const icoHTML = c => `<span class="ico" style="--c:${esc(c.color)}">${esc(c.icon)}</span>`;

/* ---------- Insights: helpers ---------- */
const dayDiff = (a,b) => Math.round((new Date(b+'T12:00') - new Date(a+'T12:00'))/864e5);
const addDays = (d,n) => { const x=new Date(d+'T12:00'); x.setDate(x.getDate()+n); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const addMonthsISO = (d,n) => { const ym=shiftYM(d.slice(0,7),n); return `${ym}-${pad(Math.min(+d.slice(8),daysIn(ym)))}`; };
const median = a => { if (!a.length) return 0; const s=[...a].sort((x,y)=>x-y), h=s.length>>1; return s.length%2 ? s[h] : (s[h-1]+s[h])/2; };
const txKey = t => merchantKey(t.t) || norm(t.t);
const short = (s,n=26) => s.length>n ? s.slice(0,n-1)+'…' : s;
const niceDate = d => new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const catSpent = (id,ym) => monthTx(ym).filter(t=>t.c===id).reduce((s,t)=>s+t.a,0);

// 8. Budget rollover: unspent budget carries into next month, overspending comes off it
function effBudget(c, ym){
  const b=c.budget||0, R=S.settings.roll;
  if (!b || !R || !R.on || !R.start || ym<=R.start) return b;
  let carry=0, m=R.start;
  while (m<ym) { carry = b + carry - catSpent(c.id,m); m=shiftYM(m,1); }
  return b + carry;
}
const totalEffBudget = ym => S.settings.cats.reduce((s,c)=>s+(c.budget?Math.max(0,effBudget(c,ym)):0),0);

// 1. Recurring payments: same shop, steady amount, regular gaps
function findRecurring(){
  const today=todayISO(), groups={}, hidden=new Set(S.settings.notRec||[]), out=[];
  let earliest=today;
  allTx().forEach(t => { const k=txKey(t); if (k) (groups[k] ||= []).push(t); if (t.d<earliest) earliest=t.d; });
  for (const [k,list] of Object.entries(groups)) {
    if (hidden.has(k) || list.length<2) continue;
    list.sort((a,b)=>a.d.localeCompare(b.d));
    const gaps=[]; for (let i=1;i<list.length;i++) gaps.push(dayDiff(list[i-1].d, list[i].d));
    const g=median(gaps); let cadence=null;
    if (g>=26 && g<=35) cadence='monthly'; else if (g>=6 && g<=8) cadence='weekly'; else if (g>=355 && g<=375) cadence='yearly'; else continue;
    const tol = cadence==='weekly'?2 : cadence==='monthly'?6 : 15;
    if (gaps.filter(x=>Math.abs(x-g)<=tol).length/gaps.length < 0.7) continue;
    const recent=list.slice(-4).map(t=>t.a), spread=Math.max(...recent)/Math.max(1,Math.min(...recent));
    if (list.length===2 ? spread>1.05 : spread>1.35) continue;
    const last=list[list.length-1], prev=list[list.length-2];
    const period = cadence==='monthly'?30.4 : cadence==='weekly'?7 : 365;
    if (dayDiff(last.d,today) > period*1.6) continue; // looks stopped
    const next = cadence==='monthly' ? addMonthsISO(last.d,1) : cadence==='yearly' ? addMonthsISO(last.d,12) : addDays(last.d,7);
    const change = Math.abs(last.a-prev.a) > Math.max(5, prev.a*0.02) ? prev.a : null;
    const monthly = cadence==='monthly' ? last.a : cadence==='weekly' ? Math.round(last.a*52/12) : Math.round(last.a/12);
    out.push({k, name:last.t, c:last.c, a:last.a, cadence, last:last.d, next, change, isNew: dayDiff(list[0].d,today)<=62 && dayDiff(earliest,list[0].d)>=35, monthly, count:list.length});
  }
  return out.sort((a,b)=>b.monthly-a.monthly);
}

// 4. Unusual payments in the last 45 days
function findUnusual(rec){
  const today=todayISO(), ok=new Set(S.settings.okUnusual||[]), all=allTx(), byK={}, byC={}, recK=new Set(rec.map(r=>r.k)), out=[];
  all.forEach(t => { (byK[txKey(t)] ||= []).push(t); (byC[t.c] ||= []).push(t.a); });
  all.filter(t => !ok.has(t.id) && dayDiff(t.d,today)>=0 && dayDiff(t.d,today)<=45).forEach(t => {
    const k=txKey(t), others=(byK[k]||[]).filter(x=>x.id!==t.id);
    if (others.length>=3) {
      const m=median(others.map(x=>x.a));
      if (t.a>m*2 && t.a-m>=1000) out.push({t, why:`You usually spend about ${fmt0(m)} here`});
    } else if (!recK.has(k) && t.c!=='housing') {
      const list=byC[t.c]||[], cm=median(list);
      if (list.length>=5 && t.a>cm*4 && t.a>=5000) out.push({t, why:`Much bigger than your usual ${catById(t.c).name} payment of about ${fmt0(cm)}`});
    }
  });
  return out.sort((a,b)=>b.t.d.localeCompare(a.t.d)).slice(0,6);
}

// 5. Where can I save?
function findTips(rec){
  const tips=[], cur=ymOf(todayISO()), m3=[shiftYM(cur,-3),shiftYM(cur,-2),shiftYM(cur,-1)];
  for (const c of S.settings.cats) {
    const v=m3.map(m=>catSpent(c.id,m));
    if (v[0]>=2000 && v[1]>=v[0] && v[2]>v[1] && v[2]>=v[0]*1.25 && v[2]-v[0]>=2000)
      tips.push({icon:c.icon, w:v[2]-v[0], text:`${c.name} has gone up three months running, from ${fmt0(v[0])} in ${ymLabel(m3[0],{month:'long'})} to ${fmt0(v[2])} in ${ymLabel(m3[2],{month:'long'})}.`});
  }
  const since=addDays(todayISO(),-30), g={};
  allTx().filter(t=>t.d>=since).forEach(t => { const o=(g[txKey(t)] ||= {n:0,s:0,name:t.t,c:t.c}); o.n++; o.s+=t.a; });
  Object.values(g).filter(o=>o.n>=6 && o.s/o.n<=1200).sort((a,b)=>b.s-a.s).slice(0,2).forEach(o =>
    tips.push({icon:catById(o.c).icon, w:o.s, text:`${o.n} payments at ${short(o.name)} in the last 30 days came to ${fmt(o.s)}. Halving them would save about ${fmt0(o.s/2*12)} a year.`}));
  const subs=rec.filter(r=>r.c==='subs');
  if (subs.length) { const s=subs.reduce((a,r)=>a+r.monthly,0); tips.push({icon:'🔁', w:s, text:`Your ${subs.length} subscription${subs.length===1?'':'s'} cost ${fmt(s)} a month, which is ${fmt0(s*12)} a year. Worth checking you still use them all.`}); }
  const day=new Date().getDate(), dim=daysIn(cur);
  for (const c of S.settings.cats) {
    if (!c.budget) continue; const b=effBudget(c,cur), sp=catSpent(c.id,cur);
    if (b>0 && day<dim-3 && sp<b && sp>b*(day/dim)*1.25) tips.push({icon:c.icon, w:sp, text:`${c.name} is running ahead of budget: ${fmt0(sp)} of ${fmt0(b)} spent with ${dim-day} days still to go.`});
  }
  rec.filter(r=>r.change && r.a>r.change).forEach(r => tips.push({icon:'📈', w:(r.a-r.change)*12, text:`${short(r.name)} went up from ${fmt(r.change)} to ${fmt(r.a)}. That’s ${fmt0((r.a-r.change)*(r.cadence==='weekly'?52:r.cadence==='yearly'?1:12))} more a year.`}));
  return tips.sort((a,b)=>b.w-a.w).slice(0,5);
}

// 9. Month-end forecast
function forecast(rec){
  const today=todayISO(), cur=ymOf(today), day=+today.slice(8), dim=daysIn(cur), recK=new Set(rec.map(r=>r.k));
  const txs=monthTx(cur), spent=txs.reduce((s,t)=>s+t.a,0);
  const past=[1,2,3].map(i=>shiftYM(cur,-i)).filter(m=>monthTx(m).length);
  if (!txs.length && !past.length) return null;
  // per category: what's spent, everyday spending per day (this month blended with recent months), bills still due
  const add = (o,k,v) => { o[k]=(o[k]||0)+v; };
  const spentC={}, curVar={}, pastVar={}, billsC={};
  txs.forEach(t => { add(spentC,t.c,t.a); if (!recK.has(txKey(t))) add(curVar,t.c,t.a); });
  past.forEach(m => monthTx(m).forEach(t => { if (!recK.has(txKey(t))) add(pastVar,t.c,t.a/daysIn(m)/past.length); }));
  rec.forEach(r => { if (r.cadence==='weekly') add(billsC,r.c,Math.floor((dim-day)/7)*r.a); else if (ymOf(r.next)<=cur && ymOf(r.last)!==cur) add(billsC,r.c,r.a); });
  const w=Math.min(1, day/14), ids=new Set([...Object.keys(spentC),...Object.keys(curVar),...Object.keys(pastVar),...Object.keys(billsC)]);
  const projC={}, dailyC={};
  ids.forEach(id => { dailyC[id] = past.length ? w*((curVar[id]||0)/day)+(1-w)*(pastVar[id]||0) : (curVar[id]||0)/day; projC[id]=(spentC[id]||0)+dailyC[id]*(dim-day)+(billsC[id]||0); });
  const sum = (o,f=()=>true) => Object.entries(o).filter(([k])=>f(k)).reduce((s,[,v])=>s+v,0);
  const budgeted = new Set(S.settings.cats.filter(c=>c.budget>0).map(c=>c.id)), inB = k => budgeted.has(k);
  return {spent, projected: Math.round(sum(projC)), daily: sum(dailyC), bills: sum(billsC), day, dim, left:dim-day,
    budget: totalEffBudget(cur), bSpent: sum(spentC,inB), bProjected: Math.round(sum(projC,inB)), bBills: sum(billsC,inB),
    partial: budgeted.size>0 && [...ids].some(k=>!inB(k) && (projC[k]||0)>0),
    budgetNames: S.settings.cats.filter(c=>c.budget>0).map(c=>c.name)};
}
function forecastLine(){
  const f=forecast(findRecurring()); if (!f || !f.left) return '';
  let extra='';
  if (f.budget>0) { const d=f.bProjected-f.budget; extra = d>0 ? ` · <b class="up">${fmt0(d)} over budget</b>` : ` · <b class="down">${fmt0(-d)} under budget</b>`; }
  return `<div class="delta num">Heading for about <b>${fmt0(f.projected)}</b> by month end${extra}</div>`;
}

// 2. Monthly summary
function reviewHTML(ym, dismiss){
  const txs=monthTx(ym); if (!txs.length) return '';
  const total=txs.reduce((s,t)=>s+t.a,0), before=monthTx(shiftYM(ym,-1)).reduce((s,t)=>s+t.a,0);
  const by={}; txs.forEach(t=>by[t.c]=(by[t.c]||0)+t.a);
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const big=txs.reduce((m,t)=>t.a>m.a?t:m);

function monthsUntil(d){ const t=todayISO(); return (+d.slice(0,4)-+t.slice(0,4))*12 + (+d.slice(5,7)-+t.slice(5,7)) + (+d.slice(8)>=+t.slice(8)?0:-1) + 1; }

function heatCard(){

  allTx().forEach(t => { if (t.d>=start && t.d<=today) sums[(new Date(t.d+'T12:00').getDay()+6)%7]+=t.a; });
  const avg=sums.map(s=>s/12), maxA=Math.max(...avg,1), names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const maxD=Math.max(...Object.values(daySum),1), td=+today.slice(8);

    <h2>When your money goes</h2>
    <div class="wk">${avg.map((v,i)=>`<div><span class="wcell" style="${cell(v,maxA)}"></span><b>${names[i]}</b><small class="num">${fmt0(v)}</small></div>`).join('')}</div>
    <p class="note">Average spend per weekday over the last 12 weeks.${avg[topI]>0?` You spend most on ${['Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays','Sundays'][topI]}.`:''}</p>
    <div class="card-h"><b class="small">${esc(ymLabel(cur))}</b><span class="small muted">Darker means more spent</span></div>

/* ---------- Spending score ---------- */
const ESSENTIAL = new Set(['groceries','bills','housing','transport','health']);
const lerp = (v, good, bad, max, min) => { const t=Math.max(0,Math.min(1,(v-good)/(bad-good))); return Math.round(max - t*(max-min)); };
function spendScore(rec){
  const today=todayISO(), cur=ymOf(today), all=allTx();
  if (!all.length) return null;
  const earliest=all.reduce((m,t)=>t.d<m?t.d:m, today), days=dayDiff(earliest,today);
  if (days<21) return {need:21-days};
  const done=[1,2,3].map(i=>shiftYM(cur,-i)).filter(m=>m>=ymOf(earliest) && monthTx(m).length);
  const mTotal = m => monthTx(m).reduce((s,t)=>s+t.a,0);
  const since90=addDays(today,-90), last90=all.filter(t=>t.d>=since90 && t.d<=today);
  const total90=last90.reduce((s,t)=>s+t.a,0), monthsCovered=Math.max(1,Math.min(90,days)/30.4), monthlyAvg=total90/monthsCovered;
  const F=[], fix=[];

  // 1. Budgets (25)
  const budgeted=S.settings.cats.filter(c=>c.budget>0), months=done.length?done:[cur];
  if (budgeted.length) {
    let ok=0,n=0; const missed=new Set();
    months.forEach(m=>budgeted.forEach(c=>{ n++; if (catSpent(c.id,m)<=effBudget(c,m)) ok++; else missed.add(c.name); }));
    F.push({name:'Sticking to budgets', max:25, pts:Math.round(25*ok/n), note:`Within budget ${ok} of ${n} times over the last ${months.length} month${months.length===1?'':'s'}`});
    if (missed.size) fix.push({gain:25-Math.round(25*ok/n), text:`You went over budget in ${[...missed].join(', ')}. If a budget is never realistic, raise it a little. If it’s one-off months, turn on carry-over in Settings so good months cover bad ones.`});
  } else {
    F.push({name:'Sticking to budgets', max:25, pts:10, note:'No budgets set yet'});
    const top=Object.entries(last90.reduce((o,t)=>(o[t.c]=(o[t.c]||0)+t.a,o),{})).filter(([id])=>!['housing','bills'].includes(id)).sort((a,b)=>b[1]-a[1]).slice(0,2);
    fix.push({gain:15, text:`Set monthly budgets in Settings, starting with your two biggest everyday categories${top.length?`: ${top.map(([id,v])=>`${catById(id).name} (about ${fmt0(v/monthsCovered)} a month)`).join(' and ')}`:''}. Aim for 10% below what you spend now.`});
  }

  // 2. Trend (20)
  let trendPts=14, trendNote='Not enough history yet to see a trend';
  const older=[4,5,6].map(i=>shiftYM(cur,-i)).filter(m=>monthTx(m).length);
  let a1=null, a0=null;
  if (done.length && older.length) { a1=done.reduce((s,m)=>s+mTotal(m),0)/done.length; a0=older.reduce((s,m)=>s+mTotal(m),0)/older.length; }
  else if (done.length>=2) { a1=mTotal(done[0]); a0=done.slice(1).reduce((s,m)=>s+mTotal(m),0)/(done.length-1); }
  if (a1!=null && a0>0) {
    const ch=(a1-a0)/a0; trendPts=Math.max(4,Math.min(20,Math.round(14-ch*60)));
    trendNote = Math.abs(ch)<0.03 ? 'Holding steady compared with before' : `${ch<0?'Down':'Up'} ${Math.round(Math.abs(ch)*100)}% compared with the months before`;
    if (ch>0.03) {
      const lm=done[0], base=done.slice(1).length?done.slice(1):older;
      const grow=S.settings.cats.map(c=>({c, d:catSpent(c.id,lm)-(base.length?base.reduce((s,m)=>s+catSpent(c.id,m),0)/base.length:0)})).sort((x,y)=>y.d-x.d)[0];
      fix.push({gain:20-trendPts, text:`Your spending is up ${Math.round(ch*100)}%.${grow&&grow.d>0?` The biggest rise is ${grow.c.name} (about ${fmt0(grow.d)} more last month), so start there.`:''}`});
    }
  }
  F.push({name:'Spending trend', max:20, pts:trendPts, note:trendNote});

  // 3. Needs vs wants (20)
  const wants=last90.filter(t=>!ESSENTIAL.has(t.c)).reduce((s,t)=>s+t.a,0), w=total90?wants/total90:0;
  const wPts=lerp(w,0.30,0.60,20,4);
  F.push({name:'Needs vs wants', max:20, pts:wPts, note:`Wants (eating out, shopping, fun and so on) are ${Math.round(w*100)}% of your spending`});
  if (w>0.35) fix.push({gain:20-wPts, text:`Wants make up ${Math.round(w*100)}% of your spending. Bringing that down to 35% would free up about ${fmt0((w-0.35)*monthlyAvg)} a month.`});

  // 4. Subscriptions (10)
  const subs=rec.filter(r=>r.c==='subs'), subsM=subs.reduce((s,r)=>s+r.monthly,0), sShare=monthlyAvg?subsM/monthlyAvg:0;
  const sPts=subs.length?lerp(sShare,0.03,0.10,10,2):10;
  F.push({name:'Subscriptions', max:10, pts:sPts, note: subs.length?`${subs.length} subscription${subs.length===1?'':'s'}, ${fmt(subsM)} a month`:'No subscriptions found'});
  if (subs.length>=2 || sPts<8) { const cheapest=[...subs].sort((a,b)=>a.monthly-b.monthly)[0]; if (cheapest) fix.push({gain:Math.max(2,10-sPts), text:`Subscriptions cost ${fmt(subsM)} a month. Cancelling the one you use least${cheapest?`, for example ${short(cheapest.name)},`:''} saves about ${fmt0(cheapest.monthly*12)} a year.`}); }

  // 5. Small, frequent buys (10)
  const since30=addDays(today,-30), g={}; let tot30=0;
  all.filter(t=>t.d>=since30 && t.d<=today).forEach(t=>{ tot30+=t.a; const o=(g[txKey(t)] ||= {n:0,s:0,name:t.t}); o.n++; o.s+=t.a; });
  const small=Object.values(g).filter(o=>o.n>=4 && o.s/o.n<=1000), smallSum=small.reduce((s,o)=>s+o.s,0), smShare=tot30?smallSum/tot30:0;
  const smPts=lerp(smShare,0.05,0.20,10,2);
  F.push({name:'Small everyday buys', max:10, pts:smPts, note: small.length?`${fmt(smallSum)} on repeat small purchases in the last 30 days`:'Very few repeat small purchases'});
  if (small.length && smPts<9) { const top=small.sort((a,b)=>b.s-a.s)[0]; fix.push({gain:10-smPts, text:`${top.n} small payments at ${short(top.name)} came to ${fmt(top.s)} in 30 days. Setting yourself a weekly limit there could save about ${fmt0(top.s*0.5*12)} a year.`}); }

  // 6. Steadiness (10)
  const recK=new Set(rec.map(r=>r.k)), weeks=Math.min(8,Math.floor(days/7));
  let stPts=7, stNote='Not enough weeks yet to judge';
  if (weeks>=3) {
    const wk=Array(weeks).fill(0);
    all.forEach(t=>{ const ago=dayDiff(t.d,today); if (ago>=0 && ago<weeks*7 && !recK.has(txKey(t)) && t.c!=='housing') wk[Math.floor(ago/7)]+=t.a; });
    const mean=wk.reduce((a,b)=>a+b,0)/weeks, sd=Math.sqrt(wk.reduce((s,v)=>s+(v-mean)**2,0)/weeks), cv=mean?sd/mean:0;
    stPts=lerp(cv,0.35,1.0,10,3); stNote = cv<=0.35 ? 'Your weekly spending is steady' : `Weekly spending swings between ${fmt0(Math.min(...wk))} and ${fmt0(Math.max(...wk))}`;
    if (stPts<8) fix.push({gain:10-stPts, text:`Your spending jumps around from week to week (your biggest week was ${fmt0(Math.max(...wk))}). Planning bigger purchases ahead and spreading them out makes the month easier to manage.`});
  }
  F.push({name:'Steady spending', max:10, pts:stPts, note:stNote});

  // 7. Saving (5)
  const goals=S.settings.goals||[], saving=goals.some(x=>x.saved>0);
  const gPts = saving?5 : goals.length?3 : 1;
  F.push({name:'Saving towards goals', max:5, pts:gPts, note: saving?'You’re putting money towards a goal': goals.length?'Goal set, nothing saved yet':'No savings goal yet'});
  if (gPts<5) fix.push({gain:5-gPts+3, text: goals.length?'Put something towards your savings goal this month, even a small amount. Moving it on payday, before you spend, makes it easier.':'Set a savings goal below, even a small one. Moving money on payday, before you spend, makes saving much easier.'});

  const score=F.reduce((s,f)=>s+f.pts,0);
  const grade = score>=85?'Excellent': score>=70?'Good': score>=55?'Fair': score>=40?'Needs work':'Struggling';
  return {score, grade, F, fix: fix.sort((a,b)=>b.gain-a.gain).slice(0,4), monthlyAvg, subsM, subs, rec, last90, monthsCovered};
}
function moneyIdeas(sc){
  const ideas=[], bills=sc.rec.filter(r=>r.c==='bills'), billsM=bills.reduce((s,r)=>s+r.monthly,0);
  if (bills.length) ideas.push({icon:'💡', text:`You pay about ${fmt0(billsM)} a month in bills (${bills.slice(0,3).map(b=>short(b.name,18)).join(', ')}). When a contract ends, compare deals and switch. Broadband, mobile and insurance often get cheaper just by asking.`});

/* ---------- CSV import ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const head = text.split(/\r?\n/).slice(0,12).join('\n');
  const cnt = ch => (head.split(ch).length-1);
  const delim = cnt(';')>cnt(',') ? ';' : cnt('\t')>cnt(',') ? '\t' : ',';
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (q) { if (ch==='"') { if (text[i+1]==='"') { f+='"'; i++; } else q=false; } else f+=ch; }
    else if (ch==='"') q=true;
    else if (ch===delim) { row.push(f); f=''; }
    else if (ch==='\n' || ch==='\r') { if (ch==='\r' && text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=ch;
  }
  if (f!=='' || row.length) { row.push(f); rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c!==''));
}
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseDate(s, order){
  s=String(s||'').trim(); let y,m,d,r;
  if ((r=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) { y=+r[1]; m=+r[2]; d=+r[3]; }
  else if ((r=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))) { let a=+r[1], b=+r[2]; y=+r[3]; if (order==='mdy') [a,b]=[b,a]; d=a; m=b; if (y<100) y+=2000; }
  else if ((r=s.match(/^(\d{1,2})(?:st|nd|rd|th)?[\s\-]+([A-Za-z]{3,9})[\s\-,]+(\d{2,4})/))) { d=+r[1]; m=MONTHS.indexOf(r[2].slice(0,3).toLowerCase())+1; y=+r[3]; if (y<100) y+=2000; }
  else if ((r=s.match(/^([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})/))) { m=MONTHS.indexOf(r[1].slice(0,3).toLowerCase())+1; d=+r[2]; y=+r[3]; }
  else return null;
  if (!(m>=1&&m<=12&&d>=1&&d<=31&&y>1990&&y<2100)) return null;
  return `${y}-${pad(m)}-${pad(d)}`;
}
function detectOrder(vals){
  for (const v of vals) { const r=String(v).match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-]/); if (!r) continue; if (+r[1]>12) return 'dmy'; if (+r[2]>12) return 'mdy'; }
  return 'dmy';
}
function parseAmount(s){
  if (s==null) return null; let t=String(s).replace(/[£$€,\s]/g,'').replace(/−/g,'-'); if (!t) return null;
  let neg=false;
  if (/^\(.*\)$/.test(t)) { neg=true; t=t.slice(1,-1); }
  if (/dr$/i.test(t)) { neg=true; t=t.slice(0,-2); } else if (/cr$/i.test(t)) t=t.slice(0,-2);
  if (t.endsWith('-')) { neg=true; t=t.slice(0,-1); }
  if (!/^[-+]?\d*\.?\d+$/.test(t)) return null;
  const n=parseFloat(t); return Math.round((neg?-n:n)*100);
}
function findHeader(rows){
  for (let i=0;i<Math.min(15,rows.length);i++){
    const r=rows[i];
    if (r.length>=2 && r.some(c=>/date/i.test(c)) && !r.some(c=>parseAmount(c)!==null && /\d/.test(c) && !/date/i.test(c) && parseDate(c)===null && c.length<12 && /^[-£\d.,()]+$/.test(c))) return i;
  }
  return rows[0] && rows[0].some(c=>parseDate(c)) ? -1 : 0;
}
function guessMap(headers, data){
  const H = headers.map(h=>h.toLowerCase());
  const find = (re, not) => H.findIndex(h => re.test(h) && !(not && not.test(h)));
  const m = {date:-1, desc:-1, amt:-1, out:-1, inn:-1, mode:'single', neg:true};
  m.date = H.findIndex(h=>h==='date'); if (m.date<0) m.date = find(/date/, /value date|posted/); if (m.date<0) m.date=find(/date/);
  m.desc = H.findIndex(h=>h==='name' || h==='merchant' || h==='payee');
  if (m.desc<0) m.desc = find(/description|details|narrative|merchant|payee|memo|counter ?party|transaction/, /date|type|amount|balance|category|id$|number|code/);
  if (m.desc<0) m.desc = find(/reference|name/, /date|amount/);
  m.amt = find(/^amount|amount$|^value$|^amount \(/, /balance|local|original/);
  m.out = find(/paid out|money out|debit|withdraw|spent|^out$/, /credit|card/);
  m.inn = find(/paid in|money in|credit|deposit|received|^in$/, /debit|card/);
  if (m.out>=0 && m.inn>=0 && m.out!==m.inn) m.mode='split'; else if (m.amt<0 && m.out>=0) { m.mode='split'; }
  // content-based fallbacks
  const sample = data.slice(0,30), cols = Math.max(...data.slice(0,30).map(r=>r.length), headers.length);
  const ratio = (i,fn) => sample.filter(r=>r[i] && fn(r[i])).length / Math.max(1,sample.length);
  if (m.date<0) { let b=0; for(let i=0;i<cols;i++){ const v=ratio(i,c=>parseDate(c)); if(v>b+.001 && v>.5){b=v;m.date=i;} } }
  if (m.mode==='single' && m.amt<0) { for(let i=0;i<cols;i++){ if(i!==m.date && ratio(i,c=>parseAmount(c)!==null)>.6){ m.amt=i; break; } } }
  if (m.desc<0) { let b=0; for(let i=0;i<cols;i++){ if(i===m.date||i===m.amt) continue; const avg=sample.reduce((s,r)=>s+(r[i]&&parseAmount(r[i])===null?r[i].length:0),0)/Math.max(1,sample.length); if(avg>b){b=avg;m.desc=i;} } }
  if (m.mode==='single' && m.amt>=0) { let n=0,p=0; sample.forEach(r=>{ const v=parseAmount(r[m.amt]); if(v<0)n++; else if(v>0)p++; }); m.neg = n>=p; }
  return m;
}
function startImport(text){
  const rows = parseCSV(text);
  if (rows.length<2) { toast('No rows found. Make sure it’s a CSV export from your bank.'); return; }
  const hi = findHeader(rows);

      const arr=S.months[r.upd.mk], i=arr.findIndex(x=>x.id===r.upd.id);
      if (i>=0) { const o=arr[i]; arr[i]={...o, t:r.t, c: (!r.auto || !o.man) ? r.c : o.c, ...(!r.auto?{man:1}:{})}; touched.add(r.upd.mk); fixed++; continue; }
    }
    const m=ymOf(r.d); (S.months[m] ||= []).push({id:uid(), d:r.d, a:r.a, t:r.t, c:r.c, ...(!r.auto?{man:1}:{})}); touched.add(m);
  }
  Object.assign(S.settings.rules, Object.fromEntries(Object.entries(I.learn).filter(([k])=>k)));
  if (!I.source) S.settings.maps[I.sig] = {...I.map};
  Store.saveSettings();
  [...touched].sort().forEach(m=>Store.saveMonth(m));
  const latest=[...touched].sort().at(-1);
  S.imp=null; S.month=latest; S.tab='overview';
  const added=pick.length-fixed;
  toast([added?`Imported ${added} payment${added===1?'':'s'}`:'', fixed?`fixed ${fixed} existing`:''].filter(Boolean).join(' · '));
  render(true);
}

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast('Excel file downloaded');
}

  const today=todayISO(); const cur=ymOf(today);
  const items=[
    ['TESCO STORES 3297','groceries',1800,5200,6], ['SAINSBURYS S/MKTS','groceries',900,3400,3], ['PRET A MANGER','eating',450,1100,5],
    ['DELIVEROO','eating',1800,3400,2], ['TFL TRAVEL CH','transport',280,1180,9], ['UBER *TRIP','transport',900,2200,1],
    ['AMAZON.CO.UK','shopping',899,4599,3], ['BOOTS','health',350,1800,1], ['ODEON CINEMAS','fun',1150,2400,1], ['GREGGS','eating',185,560,3]
  ];

    for (const [day,t,c,a] of fixed) if (day<=last) arr.push({id:uid(), d:`${m}-${pad(day)}`, a, t, c, x:true});
    for (const [t,c,lo,hi,n] of items) { const times=Math.max(0,Math.round(n*last/daysIn(m)*(0.7+rnd()*0.6))); for(let i=0;i<times;i++) arr.push({id:uid(), d:`${m}-${pad(1+Math.floor(rnd()*last))}`, a:Math.round((lo+rnd()*(hi-lo))/10)*10, t, c, x:true}); }

      if (!v) { toast('Enter an amount. Use a minus sign to take money out.'); break; }
      g.saved=Math.max(0,g.saved+v); Store.saveSettings();
      toast(g.saved>=g.target ? `${g.name}: goal reached!` : `${v>0?'Added':'Took out'} ${fmt(Math.abs(v))}`); render(true); break; }
    case 'goal-del': if (!armed(b)) break; S.settings.goals=(S.settings.goals||[]).filter(x=>x.id!==b.dataset.id); Store.saveSettings(); render(true); break;
    case 'toggle-month': {
      const m=b.dataset.m, set=new Set(S.settings.excl||[]);
      if (set.has(m)) set.delete(m); else set.add(m);
      S.settings.excl=[...set].sort(); Store.saveSettings(); render(true); break; }
    case 'incl-all': S.settings.excl=(S.settings.excl||[]).filter(m=>!m.startsWith(S.year+'-')); Store.saveSettings(); render(true); break;
    case 'goto-month': S.period='month'; S.month=b.dataset.m; window.scrollTo(0,0); render(true); break;
    case 'add': openSheet(null); break;
    case 'close': closeSheet(); break;
    case 'edit': { const t=(S.months[b.dataset.m]||[]).find(x=>x.id===b.dataset.id); if (t) openSheet(t); break; }
    case 'filter-cat': S.catFilter=b.dataset.id; S.q=''; S.tab='tx'; render(true); break;
    case 'examples': loadExamples(); break;
    case 'clear-examples': clearExamples(); break;
    case 'parse-paste': { const v=$('#csvtext').value; if (v.trim()) startImport(v); break; }
    case 'imp-cancel': S.imp=null; S.impMsg=null; render(true); break;
    case 'mode': I.map.mode=b.dataset.v;
      if (I.map.mode==='split') { if (I.map.out<0) I.map.out=0; if (I.map.inn<0) I.map.inn=Math.min(1,I.headers.length-1); } else if (I.map.amt<0) I.map.amt=0;
      buildImport(); render(true); break;
    case 'sign': I.map.neg = b.dataset.v==='neg'; buildImport(); render(true); break;
    case 'order': I.order=b.dataset.v; buildImport(); render(true); break;
    case 'imp-go': doImport(); break;
    case 'add-cat': {
      const used=new Set(S.settings.cats.map(c=>c.color)); const color=EXTRA_COLORS.find(c=>!used.has(c))||EXTRA_COLORS[S.settings.cats.length%EXTRA_COLORS.length];
      const other=S.settings.cats.findIndex(c=>c.id==='other');
      S.settings.cats.splice(other<0?S.settings.cats.length:other,0,{id:'c'+uid(), name:'New category', icon:'🏷️', color, budget:0});
      Store.saveSettings(); render(true);
      const inputs=view.querySelectorAll('[data-cf="name"]'); const el=inputs[Math.max(0,other<0?inputs.length-1:other)]; if(el){el.focus(); el.select();}
      break; }
    case 'del-cat': {
      if (!armed(b)) break; const id=b.dataset.id;
      S.settings.cats=S.settings.cats.filter(c=>c.id!==id);
      for (const k of Object.keys(S.settings.rules)) if (S.settings.rules[k]===id) delete S.settings.rules[k];
      for (const m of Object.keys(S.months)) if (S.months[m].some(t=>t.c===id)) { S.months[m]=S.months[m].map(t=>t.c===id?{...t,c:'other'}:t); Store.saveMonth(m); }
      Store.saveSettings(); toast('Category deleted. Its payments moved to Other.'); render(true); break; }
    case 'resort': { const n=resortOther(); toast(n ? `Moved ${n} payment${n===1?'':'s'} out of Other` : 'Nothing in Other could be sorted automatically'); break; }
    case 'del-rule': delete S.settings.rules[b.dataset.k]; Store.saveSettings(); render(true); break;
    case 'copy-backup': copyText(JSON.stringify({app:'pocket-ledger',v:1,exported:new Date().toISOString(),settings:S.settings,months:S.months}), 'Backup'); break;
    case 'copy-csv': {
      const q=v=>`"${String(v).replace(/"/g,'""')}"`;
      const lines=['Date,Description,Category,Amount (GBP),Note', ...allTx().sort((a,b)=>a.d.localeCompare(b.d)).map(t=>[t.d,q(t.t),q(catById(t.c).name),(t.a/100).toFixed(2),q(t.n||'')].join(','))];
      copyText(lines.join('\n'), 'CSV'); break; }
    case 'restore': {
      let d; try { d=JSON.parse($('#restore').value); } catch(_) { toast('That isn’t a TanyaAlpi backup. Paste the whole backup text.'); break; }
      if (!d || d.app!=='pocket-ledger' || !d.months) { toast('That isn’t a TanyaAlpi backup.'); break; }
      if (!armed(b)) break;
      replaceAll(d.settings, d.months); toast('Backup restored'); S.tab='overview'; render(true); break; }
    case 'wipe': if (!armed(b)) break; replaceAll(defaults(), {}); toast('All data deleted'); render(true); break;
  }
});
view.addEventListener('input', e => {
  if (e.target.id==='q') { S.q=e.target.value; renderTxList(); }
});
view.addEventListener('change', e => {
  const t=e.target;
  if (t.id==='catf') { S.catFilter=t.value; renderTxList(); return; }
  if (t.id==='roll') {
    S.settings.roll = t.checked ? {on:true, start: ymOf(todayISO())} : {on:false};
    Store.saveSettings(); toast(t.checked ? 'Budgets now carry over, starting next month' : 'Carry-over turned off'); render(true); return;
  }
  if (t.id==='csvfile' || t.id==='restorefile') {
    const f=t.files&&t.files[0]; if(!f) return;
    if (t.id==='csvfile' && t.files.length>1) { importMany([...t.files]); return; }
    if (t.id==='csvfile' && (f.type==='application/pdf' || /\.pdf$/i.test(f.name))) {
      const rp=new FileReader(); rp.onload=()=>importPdf(rp.result); rp.onerror=()=>toast('Couldn’t read that file.'); rp.readAsArrayBuffer(f); return;
    }
    S.impMsg=null;
    const rd=new FileReader(); rd.onload=()=>{ if (t.id==='csvfile') startImport(String(rd.result)); else { $('#restore').value=String(rd.result); toast('Backup loaded. Tap Replace to restore it.'); } };
    rd.onerror=()=>toast('Couldn’t read that file.'); rd.readAsText(f); return;
  }
  if (S.imp && /^m-(date|desc|amt|out|inn)$/.test(t.id)) {
    const k=t.id.slice(2); S.imp.map[k]=+t.value;
    if (k==='date') S.imp.order=detectOrder(S.imp.data.map(r=>r[S.imp.map.date]||''));
    buildImport(); render(true); return;
  }
  if (S.imp && t.matches('#irows [data-i]')) {
    const r=S.imp.rows[+t.dataset.i]; if(!r) return;
    if (t.type==='checkbox') { r.on=t.checked; render(true); return; }
    r.c=t.value; r.auto=false;
    if (r.k) { S.imp.learn[r.k]=t.value; S.imp.rows.forEach(x=>{ if(x!==r && x.k===r.k && x.auto) x.c=t.value; }); }
    render(true); return;
  }
  if (t.dataset.cf) {
    const c=S.settings.cats.find(x=>x.id===t.dataset.id); if(!c) return;
    if (t.dataset.cf==='budget') { const v=parseFloat(t.value.replace(/[£,\s]/g,'')); c.budget = isFinite(v)&&v>0 ? Math.round(v*100) : 0; }
    else if (t.dataset.cf==='name') c.name = t.value.trim() || c.name;
    else c.icon = t.value.trim() || c.icon;
    saveSettingsSoon(); return;
  }
  if (t.dataset.rule) { S.settings.rules[t.dataset.rule]=t.value; saveSettingsSoon(); }
});
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

function flagSVG(code){
  if (code==='ua') return '<svg viewBox="0 0 30 20" role="img" aria-label="Ukraine flag"><rect width="30" height="10" fill="#0057B7"></rect><rect y="10" width="30" height="10" fill="#FFD700"></rect></svg>';
  const cx=16, cy=10, ro=2.5, ri=1.0, pts=[];
  for (let i=0;i<10;i++){ const a=Math.PI+i*Math.PI/5, r=i%2?ri:ro; pts.push((cx+r*Math.cos(a)).toFixed(2)+','+(cy+r*Math.sin(a)).toFixed(2)); }
  return `<svg viewBox="0 0 30 20" role="img" aria-label="Turkey flag"><rect width="30" height="20" fill="#E30A17"></rect><circle cx="11" cy="10" r="5" fill="#FFFFFF"></circle><circle cx="12.25" cy="10" r="4" fill="#E30A17"></circle><polygon points="${pts.join(' ')}" fill="#FFFFFF"></polygon></svg>`;
}
$('#mark').innerHTML = flagSVG('ua') + flagSVG('tr');
$('#gear').innerHTML = $('#gearsvg').innerHTML;
$('#foot').innerHTML = flagSVG('ua') + '<span>TanyaAlpi</span>' + flagSVG('tr');

render(true);
Store.init();
})();
</script>
